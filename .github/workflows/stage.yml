name: Stage → Verdaccio

# Staging publish. Runs on GITEA ONLY (the `if` guards against GitHub). Publishes to the
# internal Verdaccio under the `stg` dist-tag, from a `release/**` branch or from a `v*` tag.
# Staging versions are intentionally mutable: an existing prerelease is removed before
# publishing the updated release candidate under the same version.
#
# The tag trigger is what makes creating a tag on Gitea safe. It runs the real publish path —
# the same `prepublishOnly` gate, the same tarball, the same commit — against a registry we
# can overwrite, so the release is proven before the tag is promoted to GitHub, where npm
# allows 72 hours to unpublish and JSR allows nothing at all.
on:
  push:
    branches: ['release/**']
    tags: ['v*']

jobs:
  publish-stg:
    if: ${{ github.server_url != 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      # Same scoped gate as ci.yml: only what we ship blocks a publish. A `tsup` advisory
      # reaches nobody, and holding a release candidate for one is how staging stalls on work
      # that has nothing to do with the package. The full audit still reports.
      - run: npm audit --omit=dev
      - run: npm audit
        continue-on-error: true
      - name: Validate release candidate
        run: npm run prepublishOnly
      - name: Publish to Verdaccio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH }}
        run: |
          npm config set //npm.svc.zoit.services/:_authToken "$NODE_AUTH_TOKEN"
          VER=$(node -p "require('./package.json').version")
          # Stable versions are staged too (#72). Verdaccio is a private staging registry used
          # only to try a release before the public one, with no consumers that depend on a
          # version staying put, so overwriting a stable number there costs nothing.
          npm unpublish "@green-tea/core@$VER" --registry https://npm.svc.zoit.services --force 2>/dev/null || true
          npm publish --ignore-scripts --registry https://npm.svc.zoit.services --tag stg
