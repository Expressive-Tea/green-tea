name: Stage → Verdaccio

# Staging publish. Runs on GITEA ONLY (the `if` guards against GitHub) for release
# branches. Publishes prereleases to the internal Verdaccio under the `stg` dist-tag.
# Staging versions are intentionally mutable: an existing prerelease is removed before
# publishing the updated release candidate under the same version.
on:
  push:
    branches: ['release/**']

jobs:
  publish-stg:
    if: ${{ github.server_url != 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Same scoped gate as ci.yml: only what we ship blocks a publish. A `tsup` advisory
      # reaches nobody, and holding a release candidate for one is how staging stalls on work
      # that has nothing to do with the package. The full audit still reports.
      - run: npm audit --omit=dev
      - run: npm audit
        continue-on-error: true
      - name: Validate release candidate
        run: npm run prepublishOnly
      - name: Publish prerelease to Verdaccio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH }}
        run: |
          npm config set //npm.svc.zoit.services/:_authToken "$NODE_AUTH_TOKEN"
          VER=$(node -p "require('./package.json').version")
          case "$VER" in
            *-*) ;;
            *) echo "Refusing to stage non-prerelease version: $VER" >&2; exit 1 ;;
          esac
          npm unpublish "@green-tea/core@$VER" --registry https://npm.svc.zoit.services --force 2>/dev/null || true
          npm publish --ignore-scripts --registry https://npm.svc.zoit.services --tag stg
