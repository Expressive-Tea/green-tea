name: CI
on:
  push:
    branches: [develop, main, contrib]
  pull_request:
    branches: [develop, main, contrib]
jobs:
  # Separate job so a missing sign-off reports on its own and doesn't hide behind the code
  # gates, and so it costs nothing on push. Checks that the trailer is present, not that it
  # matches the author — a mismatch is a judgement call for a reviewer, an absent trailer
  # is not, and telling a contributor on their first push beats telling them on review.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit needs a Signed-off-by
        env:
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$RANGE"); do
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q '[^[:space:]]'; then
              echo "::error::no Signed-off-by: $(git show -s --format='%h %s' "$sha")"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "We use the DCO instead of a CLA. See CONTRIBUTING.md."
            echo "Fix the whole branch with: git rebase --signoff ${{ github.event.pull_request.base.sha }}"
            echo "Then: git push --force-with-lease"
            exit 1
          fi
          echo "All commits signed off."

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run complexity:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Supply chain, deliberately after the code gates: an advisory published by a third party
      # must never decide whether a contributor gets to see their own lint and typecheck output.
      # Only what we ship blocks — with `reflect-metadata` as the sole runtime dependency, a
      # production advisory is rare and genuinely reaches users. Build tooling only reports.
      - run: npm audit --omit=dev
      - run: npm audit
        continue-on-error: true

  # Runs everywhere is the headline claim, so it gets tested rather than asserted. `npm test` is
  # Node only: a change to shared code can pass it and still be broken on Deno or Bun, which is
  # exactly why these suites exist separately. Leaving them out of CI meant the claim rested on
  # whoever remembered to run them locally.
  #
  # Its own job, not more steps on `build`, for the reason the audit sits where it does: a Bun
  # failure should read as a Bun failure instead of burying the Node lint output.
  runtimes:
    runs-on: ubuntu-latest
    strategy:
      # One runtime breaking must not cancel the others — which one else broke is the useful part
      # of the answer, and a cancelled job reports as if it had never been asked.
      fail-fast: false
      matrix:
        runtime: [deno, bun, edge]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # All three need the dependency tree: the edge suite drives workerd from a Node process, and
      # Deno and Bun resolve `reflect-metadata` out of node_modules like any other import.
      - run: npm ci
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - run: npm run test:${{ matrix.runtime }}
