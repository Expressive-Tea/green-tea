name: Release → npmjs

# Production publish. Runs on GITHUB ONLY, on a version tag (`v*`). Publishes the stable
# package to npmjs via OIDC **Trusted Publishing** — no long-lived token. Requires a trusted
# publisher configured on npmjs for this package (org Expressive-Tea, repo green-tea,
# workflow release.yml). npm also attaches build provenance automatically.
on:
  push:
    tags: ['v*']

jobs:
  publish-prod:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    env:
      PKG: '@green-tea/core'
    permissions:
      id-token: write # OIDC for Trusted Publishing (also enables provenance)
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest # npm >= 11.5.1 is required for OIDC trusted publishing
      - run: npm ci
      # Same scoped gate as ci.yml: only what we ship blocks a publish. With `reflect-metadata`
      # as the sole runtime dependency, a blocking advisory here is rare and genuinely reaches
      # users; a build-tooling one never does. The full audit still reports.
      - run: npm audit --omit=dev
      - run: npm audit
        continue-on-error: true
      # `npm publish` runs prepublishOnly (lint + complexity + typecheck + test + build) first.
      # No NODE_AUTH_TOKEN — npm exchanges the OIDC id-token for a short-lived publish token.
      # A prerelease (26.7.0-beta.N) publishes under its channel tag (beta/alpha/rc) so `latest`
      # never points at a beta; a stable version publishes under `latest`.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Gate both registries before either one ships. JSR checks things npm never looks at — slow
      # types, module analysis — and learning about them after npm has published leaves the tag
      # half-shipped. Seconds, against a failure mode with no clean recovery.
      - run: deno publish --dry-run
      # A publish sets exactly one dist-tag, and it is the only npm write this workflow can make:
      # Trusted Publishing's OIDC exchange lives inside `npm publish` and nowhere else, so the token
      # it produces is rejected by `npm dist-tag` (E401, learned on v26.8.0-beta.1). So the one tag
      # the publish gets has to be the one that matters most.
      #
      # While no stable release exists, `latest` and the channel tag mean the same thing — there is
      # nothing else to install — and `latest` takes it, because that is what a bare
      # `npm install @green-tea/core` resolves to. Leaving it behind on an older beta would hand the
      # default install an older build than the one just released. The channel tag is then moved by
      # hand; the step prints the command. Once a stable version exists it owns `latest` for good,
      # a later beta must not drag it backwards, and the channel tag becomes the automatic one again.
      - name: Publish to npmjs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CHANNEL=$(node -e "const m=process.argv[1].match(/-([a-z]+)/);console.log(m?m[1]:'latest')" "$VERSION")
          # Read the list into a variable so a failed lookup fails the step, rather than passing for
          # "no stable exists" and pointing `latest` at a prerelease that should not have it.
          VERSIONS=$(npm view "$PKG" versions --json)
          if [ "$CHANNEL" != latest ] \
             && ! node -e "process.exit([].concat(JSON.parse(process.argv[1])).some(v=>!v.includes('-'))?0:1)" "$VERSIONS"; then
            TAG=latest
          else
            TAG=$CHANNEL
          fi
          echo "$VERSION under dist-tag: $TAG"
          # Skip rather than fail when the version is already up, so a re-run after a later failure
          # can finish the remaining work instead of dying on a duplicate npm rejects anyway.
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "npm already has $VERSION"
          else
            npm publish --access public --tag "$TAG"
          fi
          if [ "$TAG" != "$CHANNEL" ]; then
            echo "::notice::Move the channel tag by hand: npm dist-tag add $PKG@$VERSION $CHANNEL"
          fi
      # JSR last, deliberately. npm allows an unpublish within 72 hours; JSR versions are immutable
      # and can never be replaced or removed. Ordered so a failure here costs a re-run, while a
      # failure *after* it would cost a version number permanently. Version and entry points come
      # from deno.json, which `test/package-metadata.test.ts` pins to package.json — JSR has no
      # dist-tags, so a prerelease simply publishes under its own version. Auth is the same OIDC
      # id-token npm just used; the package is linked to this repository on jsr.io.
      - name: Publish to JSR
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PKG=${PKG#@}
          # 404 until the version exists, and also for a package with no versions at all — which is
          # what this one was until v26.8.0-beta.1 — so the guard must not read a 404 as an error.
          if curl -fsS -o /dev/null "https://api.jsr.io/scopes/${PKG%%/*}/packages/${PKG#*/}/versions/$VERSION"; then
            echo "JSR already has $VERSION"
          else
            deno publish
          fi
